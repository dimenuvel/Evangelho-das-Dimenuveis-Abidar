name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug --stacktrace --no-build-cache
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Abidar-The-Cosmic-Carpet-Ride.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abidar-The-Cosmic-Carpet-Ride-APK
          path: android/app/build/outputs/apk/debug/Abidar-The-Cosmic-Carpet-Ride.apk
          retention-days: 30
